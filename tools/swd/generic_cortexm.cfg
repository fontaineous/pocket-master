# Generic Cortex-M target over SWD using an ST-LINK/V2-1 (e.g. the one on a Nucleo board with its CN2 jumpers removed).
# UNTESTED. Needs OpenOCD 0.12 or newer. Read-only use: do not run any flash erase/write commands from this config.
#   openocd -f tools/swd/generic_cortexm.cfg
# then in another terminal:  telnet localhost 4444   (or use  -c "..."  on the command line)
source [find interface/stlink-dap.cfg]
transport select dapdirect_swd
adapter speed 400
set CHIPNAME pm_m4
swd newdap $CHIPNAME cpu
dap create $CHIPNAME.dap -chain-position $CHIPNAME.cpu
target create $CHIPNAME.cpu cortex_m -dap $CHIPNAME.dap
# Do not reset: first look without touching the target.  If the chip does not answer, retry with
#   reset_config srst_only srst_nogate connect_assert_srst
# and wire NRST.
init
