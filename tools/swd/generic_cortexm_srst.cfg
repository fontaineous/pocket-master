# Same as generic_cortexm.cfg but asserts NRST while connecting (CN4 pin 5 must be wired to the pedal's reset pin).
# UNTESTED. Use when the plain config reports "unable to connect to the target": firmware that re-purposes the SWD pins after boot
# can only be reached while the chip is held in reset.
source [find interface/stlink-dap.cfg]
transport select dapdirect_swd
adapter speed 100
reset_config srst_only srst_nogate connect_assert_srst
set CHIPNAME pm_m4
swd newdap $CHIPNAME cpu -irlen 4
dap create $CHIPNAME.dap -chain-position $CHIPNAME.cpu
target create $CHIPNAME.cpu cortex_m -dap $CHIPNAME.dap
init
